<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative verification fixture</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#17213b;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}h1{font-size:28px;margin:0}.badge{font-size:12px;color:#667085}main{max-width:960px;margin:auto}.summary{background:#4f46e5;color:white;border-radius:20px;padding:28px;margin-bottom:24px}.summary strong{display:block;font-size:44px;margin-top:12px}.item{display:flex;align-items:center;gap:16px;background:white;border-radius:14px;margin:12px 0;padding:20px;border:1px solid #e5e8f0}.item input{width:20px;height:20px}.item small{display:block;color:#667085;margin-top:6px}button{border:0;background:#4f46e5;color:white;border-radius:10px;padding:12px 20px}.fixture{margin-top:24px;color:#667085;font-size:12px}@media(min-width:800px){.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{min-height:110px}}</style></head>
<body><main><header><h1 id="title">Daily Focus</h1><span class="badge">9:41</span></header><section class="summary"><span id="progress">Today’s progress</span><strong>3 / 4</strong></section><section class="items"><label class="item"><input type="checkbox" checked><span id="one">Plan your day<small>08:30</small></span></label><label class="item"><input type="checkbox" checked><span id="two">Take a mindful break<small>12:00</small></span></label><label class="item"><input type="checkbox" checked><span id="three">Read something new<small>15:30</small></span></label><label class="item"><input type="checkbox"><span id="four">Review your progress<small>19:00</small></span></label></section><button id="add">Add a habit</button><p class="fixture" id="fixture">Rendered test application · synthetic acceptance fixture</p></main>
<script>if(new URLSearchParams(location.search).get('locale')==='zh-Hans'){document.documentElement.lang='zh-Hans';for(const [id,text] of Object.entries({title:'每日专注',progress:'今天的进展',one:'规划一天',two:'休息一下',three:'阅读新知识',four:'回顾今天',add:'添加习惯',fixture:'真实渲染的测试界面 · 合成验收样例'}))document.getElementById(id).firstChild.textContent=text}document.getElementById('add').onclick=()=>document.querySelector('.items').insertAdjacentHTML('beforeend','<label class="item"><input type="checkbox"><span>New habit</span></label>')</script></body></html>
