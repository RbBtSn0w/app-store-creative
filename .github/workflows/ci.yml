name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tests:
    name: Unit tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run sharded unit tests
        run: python3 .github/run_sharded_tests.py --shard ${{ matrix.shard }} --total 4

  validate-distribution:
    name: Validate distribution & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate plugin package
        run: python3 .github/validate_plugin.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/app-store-creative/studio/package-lock.json

      - name: Test and build Studio frontend
        working-directory: plugins/app-store-creative/studio
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

      - name: Smoke-test complete plugin distribution
        run: python3 .github/package_plugin.py --output /tmp/app-store-creative.zip

      - name: Setup release Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release tooling
        run: |
          npm ci --ignore-scripts
          npm run test:release

      - name: Preserve validated distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: validated-plugin-${{ github.sha }}
          path: /tmp/app-store-creative.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate-tests, validate-distribution]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check release-bot configuration
        id: release-bot-config
        env:
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_BOT_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint release-bot token
        id: release-bot
        if: ${{ vars.RELEASE_BOT_APP_ID != '' && steps.release-bot-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Retrieve validated distribution
        uses: actions/download-artifact@v8
        with:
          name: validated-plugin-${{ github.sha }}
          path: .build/validated
      - name: Extract validated distribution
        run: python3 -m zipfile -e .build/validated/app-store-creative.zip .build/validated
      - name: Publish plugin release
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token || github.token }}
        run: npm run release
