name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin package
        run: python3 .github/validate_plugin.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/app-store-creative/studio/package-lock.json

      - name: Test and build Studio frontend
        working-directory: plugins/app-store-creative/studio
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate consumer templates offline
        env:
          APP_STORE_CREATIVE_CLI: plugins/app-store-creative/scripts/app_store_creative.py
        run: |
          plugins/app-store-creative/assets/templates/validate-app-store-creative.sh \
            plugins/app-store-creative/assets/templates/project.json \
            plugins/app-store-creative/assets/templates/release.json
