name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin package
        run: python3 .github/validate_plugin.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/app-store-creative/studio/package-lock.json

      - name: Test and build Studio frontend
        working-directory: plugins/app-store-creative/studio
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

      - name: Smoke-test complete plugin distribution
        run: python3 .github/package_plugin.py --output /tmp/app-store-creative.zip
