version: 2
updates:
  # Root npm dependencies (semantic-release and release tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      release-tooling:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # Studio frontend dependencies
  - package-ecosystem: "npm"
    directory: "/plugins/app-store-creative/studio"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      studio-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
